[package]
name = "educational-blackjack"
version = "0.1.0"
description = "Educational Blackjack Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "educational_blackjack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10.0"
tauri-plugin-store = "2.4.2"
aes-gcm = "0.10.3"
